name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Statamic ${{ matrix.statamic }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        statamic: ['^5.59', '^6.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, exif, gd, xmlreader, xmlwriter
          coverage: none

      - name: Install dependencies
        run: composer update --with "statamic/cms:${{ matrix.statamic }}" --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
